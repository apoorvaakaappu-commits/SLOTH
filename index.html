<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🦥 SLOTH Embedded Lab</title>
<style>
body{
margin:0;
font-family:Consolas,monospace;
color:#00ffd5;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.85),rgba(0,0,0,0.9)),
url("https://upload.wikimedia.org/wikipedia/commons/8/8f/Circuit_board_background.jpg");
background-size:cover;
background-attachment:fixed;
}

h1{
font-size:60px;
margin-top:30px;
text-shadow:0 0 30px #00ffd5,0 0 60px #00aaff;
}

.menu{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin-top:40px;
}

.card{
width:200px;
height:120px;
border:2px solid #00ffd5;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
background:rgba(0,0,0,.5);
transition:0.3s;
}
.card:hover{
box-shadow:0 0 25px #00ffd5,0 0 50px #00aaff;
transform:scale(1.05);
}

.panel{display:none;padding:20px;}

select,input,button,textarea{
background:#000;
color:#00ffd5;
border:1px solid #00ffd5;
margin:6px;
padding:6px;
font-size:16px;
}

textarea{width:95%;height:250px;}
canvas{background:black;border:1px solid #00ffd5;width:900px;max-width:95%;height:380px;}
button:hover{box-shadow:0 0 10px #00ffd5;cursor:pointer;}

ul{list-style:none;padding-left:0;}
li{margin:5px;font-size:16px;}
</style>
</head>
<body>

<h1>🦥 SLOTH</h1>

<div class="menu">
<div class="card" onclick="show('firmware')">⚙ Firmware</div>
<div class="card" onclick="show('calc')">📐 Calculations</div>
<div class="card" onclick="show('waves')">🌊 Waves</div>
</div>

<!-- FIRMWARE -->
<div id="firmware" class="panel">
<h2>⚙ Firmware Builder 🤖</h2>

<select id="family"></select>
<select id="mcu"></select>
<select id="lang"></select>
<select id="component"></select>
<select id="func"></select>
<select id="pin"></select>

<br>
<button onclick="addModule()">➕ Add Module</button>
<button onclick="generate()">⚡ Generate Code</button>
<button onclick="copyCode()">📋 Copy</button>
<button onclick="clearCode()">🧹 Clear</button>

<ul id="modules"></ul>
<textarea id="code"></textarea>
<br>
<button onclick="home()">🏠 Home</button>
</div>

<!-- CALCULATIONS -->
<div id="calc" class="panel">
<h2>📐 Engineering Calculations</h2>
<select id="calcType"></select>
<div id="inputs"></div>
<button onclick="solve()">⚡ Solve</button>
<h3 id="result"></h3>
<button onclick="home()">🏠 Home</button>
</div>

<!-- WAVES -->
<div id="waves" class="panel">
<h2>🌊 Wave Generator</h2>
<select id="waveType">
<option>sine</option>
<option>square</option>
<option>triangle</option>
<option>saw</option>
<option>noise</option>
</select>
<input id="freq" type="number" value="1">
<input id="amp" type="number" value="80">
<button onclick="startWave()">▶ Start</button>
<button onclick="stopWave()">⏸ Stop</button>
<br><br>
<canvas id="scope"></canvas>
<br>
<button onclick="home()">🏠 Home</button>
</div>

<script>
function show(id){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none")
document.getElementById(id).style.display="block"
}
function home(){
document.querySelectorAll(".panel").forEach(p=>p.style.display="none")
}

/* MCU & Languages */
const MCU={
"Arduino":["Uno","Nano","Mega","Leonardo","Due","Nano Every"],
"ESP":["ESP8266","ESP32","ESP32-S2","ESP32-S3","ESP32-C3"],
"STM32":["STM32F030","STM32F103","STM32F407","STM32F429"],
"AVR":["ATmega328","ATmega2560","ATtiny85","ATtiny84"],
"PIC":["PIC16F877A","PIC18F4550","PIC18F25K50"],
"NXP":["LPC1768","LPC2148"],
"TI":["MSP430G2553","TM4C123"],
"Nordic":["nRF52832","nRF52840"],
"Renesas":["RX62N","RL78"],
"Infineon":["XMC4500","TriCore TC275"],
"Silicon Labs":["EFM32GG","C8051F410"],
"RP2040":["Raspberry Pi Pico"]
}
const LANG={
"Arduino":["Arduino C++"],
"ESP":["Arduino","MicroPython"],
"STM32":["C","HAL"],
"AVR":["C","Arduino"],
"PIC":["C"],
"NXP":["C"],
"TI":["C"],
"Nordic":["C"],
"Renesas":["C"],
"Infineon":["C"],
"Silicon Labs":["C"],
"RP2040":["MicroPython","C"]
}

const family=document.getElementById("family")
const mcu=document.getElementById("mcu")
const lang=document.getElementById("lang")
for(let f in MCU){let o=document.createElement("option");o.textContent=f;family.appendChild(o);}
family.onchange=function(){
mcu.innerHTML="";lang.innerHTML="";
MCU[family.value].forEach(ch=>{
let o=document.createElement("option");o.textContent=ch;mcu.appendChild(o);})
LANG[family.value].forEach(l=>{
let o=document.createElement("option");o.textContent=l;lang.appendChild(o);})
}

/* Components & Functions */
const components=[
"💡 LED","🌈 RGB LED","🔘 Button","🔔 Buzzer","⚙ Servo","🔄 Stepper Motor","🛞 DC Motor","📟 LCD","🖥 OLED","📡 UART","🌡 Temp Sensor","💾 EEPROM","⏱ RTC"
]
const component=document.getElementById("component")
components.forEach(c=>{let o=document.createElement("option");o.textContent=c;component.appendChild(o);})
const FUNC={
"💡 LED":["ON","OFF","Toggle","PWM Brightness"],
"🌈 RGB LED":["Set Color","Blink"],
"🔘 Button":["Read","Interrupt"],
"🔔 Buzzer":["Beep","Tone"],
"⚙ Servo":["0°","90°","180°","Sweep"],
"🔄 Stepper Motor":["Step","Direction","Speed"],
"🛞 DC Motor":["Forward","Reverse","Stop","PWM Speed"],
"📟 LCD":["Print Text","Clear"],
"🖥 OLED":["Draw Pixel","Draw Text","Clear"],
"📡 UART":["Send","Receive"],
"🌡 Temp Sensor":["Read","Calibrate"],
"💾 EEPROM":["Write","Read"],
"⏱ RTC":["Set Time","Read Time"]
}
const func=document.getElementById("func")
component.onchange=function(){
func.innerHTML=""
FUNC[component.value].forEach(f=>{
let o=document.createElement("option");o.textContent=f;func.appendChild(o);})
}

/* Pins */
const pin=document.getElementById("pin")
for(let i=0;i<40;i++){let o=document.createElement("option");o.textContent=i;pin.appendChild(o);}

/* Modules */
let list=[];const modules=document.getElementById("modules")
function addModule(){
list.push({c:component.value,f:func.value,p:pin.value})
let li=document.createElement("li")
li.textContent=`${component.value} → ${func.value} (Pin ${pin.value})`
modules.appendChild(li)
}

/* Firmware code generation */
function generate(){
let setup="void setup(){\nSerial.begin(115200);\n"
let loop="void loop(){\n"
list.forEach(m=>{
if(m.c.includes("LED")){setup+=`pinMode(${m.p},OUTPUT);\n`;loop+=`digitalWrite(${m.p},HIGH);\n`;}
if(m.c.includes("Button")){setup+=`pinMode(${m.p},INPUT_PULLUP);\n`;loop+=`if(digitalRead(${m.p})==LOW){Serial.println("Pressed");}\n`;}
if(m.c.includes("Servo")){setup+=`#include <Servo.h>\nServo s;\ns.attach(${m.p});\n`;loop+=`s.write(90);\n`;}
if(m.c.includes("Buzzer")){setup+=`pinMode(${m.p},OUTPUT);\n`;loop+=`tone(${m.p},1000);\n`;}
})
loop+="delay(500);\n}\n";setup+="}\n"
document.getElementById("code").value=setup+loop
}
function copyCode(){navigator.clipboard.writeText(document.getElementById("code").value);alert("✅ Code Copied!")}
function clearCode(){document.getElementById("code").value="";modules.innerHTML="";list=[]}

/* Calculators */
const CALCS={
"Ohm Law":["V","I","R"],
"Power":["P","V","I"],
"LED Resistor":["Vs","Vf","I"],
"Capacitor Energy":["E","C","V"],
"RC Time Constant":["Tau","R","C"],
"Inductor Energy":["E","L","I"],
"Voltage Divider":["Vin","Vout","R1","R2"],
"Duty Cycle":["D","Ton","T"],
"Efficiency":["Eff","Pout","Pin"],
"Voltage Gain":["Av","Vout","Vin"]
}
const calcType=document.getElementById("calcType")
const inputs=document.getElementById("inputs")
for(let c in CALCS){let o=document.createElement("option");o.textContent=c;calcType.appendChild(o);}
calcType.onchange=function(){inputs.innerHTML="";CALCS[calcType.value].forEach(v=>{inputs.innerHTML+=`${v}: <input id="${v}"><br>`})}
function solve(){
let vals={};CALCS[calcType.value].forEach(v=>{vals[v]=parseFloat(document.getElementById(v)?.value)||0})
let res=""
if(calcType.value=="Ohm Law"){if(!vals.V)vals.V=vals.I*vals.R;if(!vals.I)vals.I=vals.V/vals.R;if(!vals.R)vals.R=vals.V/vals.I;res=`V=${vals.V} I=${vals.I} R=${vals.R}`}
else if(calcType.value=="Power"){if(!vals.P)vals.P=vals.V*vals.I;if(!vals.V)vals.V=vals.P/vals.I;if(!vals.I)vals.I=vals.P/vals.V;res=`P=${vals.P} V=${vals.V} I=${vals.I}`}
else if(calcType.value=="LED Resistor"){if(!vals.R)vals.R=(vals.Vs-vals.Vf)/vals.I;res=`R=${vals.R} Ω`;}
else if(calcType.value=="Capacitor Energy"){if(!vals.E)vals.E=0.5*vals.C*vals.V*vals.V;res=`E=${vals.E} J`;}
else if(calcType.value=="RC Time Constant"){if(!vals.Tau)vals.Tau=vals.R*vals.C;res=`Tau=${vals.Tau} s`;}
else if(calcType.value=="Inductor Energy"){if(!vals.E)vals.E=0.5*vals.L*vals.I*vals.I;res=`E=${vals.E} J`;}
else if(calcType.value=="Voltage Divider"){if(!vals.Vout)vals.Vout=vals.Vin*vals.R2/(vals.R1+vals.R2);res=`Vout=${vals.Vout} V`;}
else if(calcType.value=="Duty Cycle"){if(!vals.D)vals.D=vals.Ton/vals.T;res=`D=${vals.D}`;}
else if(calcType.value=="Efficiency"){if(!vals.Eff)vals.Eff=vals.Pout/vals.Pin*100;res=`Eff=${vals.Eff} %`;}
else if(calcType.value=="Voltage Gain"){if(!vals.Av)vals.Av=vals.Vout/vals.Vin;res=`Av=${vals.Av}`;}
document.getElementById("result").innerText=res
}

/* Waves */
let run=false,phase=0
function startWave(){run=true
let canvas=document.getElementById("scope"),ctx=canvas.getContext("2d")
canvas.width=canvas.clientWidth
function draw(){if(!run)return;ctx.clearRect(0,0,canvas.width,canvas.height)
let f=parseFloat(freq.value),a=parseFloat(amp.value),type=waveType.value,center=canvas.height/2
ctx.beginPath()
for(let x=0;x<canvas.width;x++){let t=(x/100)+phase,y=0
if(type=="sine")y=a*Math.sin(2*Math.PI*f*t)
if(type=="square")y=a*(Math.sin(2*Math.PI*f*t)>0?1:-1)
if(type=="triangle")y=a*(2*Math.asin(Math.sin(2*Math.PI*f*t))/Math.PI)
if(type=="saw")y=a*(2*(t*f-Math.floor(0.5+t*f)))
if(type=="noise")y=a*(Math.random()-0.5)
y=center-y;if(x==0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
ctx.strokeStyle="#00ffd5";ctx.stroke();phase+=0.02;requestAnimationFrame(draw)}
draw()
}
function stopWave(){run=false}

</script>
</body>
</html>
